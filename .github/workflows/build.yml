name: Build Windows release

# Builds ms43-ai-tuner.exe and ms43-ai-tuner-mcp.exe on Windows and attaches them to a
# GitHub Release. Two triggers:
#   * pushing a tag like v1.0.0  -> creates a release with that tag;
#   * manually (Actions -> Run workflow) -> only builds the artifacts.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write        # needed to create the release and upload files

# Force UTF-8 on the runner: the console there is cp1252, and Russian-mode
# output in selftest.py would crash with UnicodeEncodeError.
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller reportlab

      - name: Self-test
        run: python selftest.py

      - name: Fetch the MS4X Wiki reference (private build only)
        # The wiki is third-party content and is not kept in git. The private
        # build downloads it here and bundles it into the .exe; the public one
        # skips this step and users download it from inside the app. A failed
        # download only means a build without the reference.
        if: github.repository == 'rz6hkh/ms43diff'
        continue-on-error: true
        run: >-
          python -c "from ms43diff import wikicache as w;
          r = w.download(folder=w.bundled_dir());
          print('pages:', r['pages'], 'errors:', r['errors'])"

      - name: Build .exe
        run: python build_exe.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ms43-ai-tuner-windows
          path: |
            dist/*.exe
            dist/*.bat
            dist/*.zip
          if-no-files-found: error

      - name: Create release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.bat
            dist/*.zip
          generate_release_notes: true
          body: |
            Windows build of MS43 AI-Tuner. No Python needed. Interface in English and Russian
            (switch at the bottom left of the window).

            **Easiest:** download `ms43-ai-tuner-windows.zip`, unpack it into one folder and run
            `ms43-ai-tuner.exe`.

            * `ms43-ai-tuner.exe` — the window: compare firmware, heat-map views, versions and
              porting plan, patches, VE tuning, the MS4X Wiki reference, the AI assistant.
            * `ms43-ai-tuner-mcp.exe` — the MCP server through which Claude reads your firmware.
            * `mcp-add.bat` / `mcp-remove.bat` — connect / disconnect it to Claude Desktop by
              dropping your `.xdf` and `.bin` onto it. The same is in the window:
              **AI assistant → Claude Desktop → Connect / update**.

            The MS4X Wiki reference: if this build does not carry it, download it in the app
            (**Reference → Update from site**).
