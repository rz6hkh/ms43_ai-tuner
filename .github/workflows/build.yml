name: Build Windows release

# Builds ms43-ai-tuner.exe on Windows and attaches it to a
# GitHub Release. Triggers:
#   * pushing a tag like v1.0.0  -> creates a release with that tag;
#   * manually (Actions -> Run workflow) with "release" empty -> only builds the artifacts;
#   * manually with "release" = 1.2.0 -> builds, creates the tag v1.2.0 on this commit and
#     the release (the version must match ms43diff/__init__.py).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release:
        description: "Release version, e.g. 1.2.0 (empty = only build)"
        required: false
        default: ""

permissions:
  contents: write        # needed to create the release and upload files

# Force UTF-8 on the runner: the console there is cp1252, and Russian-mode
# output in selftest.py would crash with UnicodeEncodeError.
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller reportlab pyserial

      - name: Release version matches the code
        if: github.event_name == 'workflow_dispatch' && inputs.release != ''
        env:
          RELEASE: ${{ inputs.release }}
        run: >-
          python -c "import os, ms43diff as m; v = os.environ['RELEASE'].lstrip('v');
          assert v == m.__version__, f'release {v} != code version {m.__version__}';
          print('releasing', v)"

      - name: Self-test
        run: python selftest.py

      - name: Fetch the MS4X Wiki reference (private build only)
        # The wiki is third-party content and is not kept in git. The private
        # build downloads it here and bundles it into the .exe; the public one
        # skips this step and users download it from inside the app. A failed
        # download only means a build without the reference.
        if: github.repository == 'rz6hkh/ms43diff'
        continue-on-error: true
        run: >-
          python -c "from ms43diff import wikicache as w;
          r = w.download(folder=w.bundled_dir());
          print('pages:', r['pages'], 'errors:', r['errors']);
          print('new MS43 pages added:', r['added']);
          print('new pages skipped:', r['skipped'], r['listing_error'])"

      - name: Build .exe (with the bundled Python for Claude Code)
        run: python build_exe.py --with-python

      - name: Check what the .exe carries (wiki, project kit, bundled Python)
        shell: pwsh
        run: |
          Copy-Item dist\ms43-ai-tuner.exe dist\check.exe
          Start-Process -FilePath dist\check.exe -ArgumentList "--check","check.json" -Wait
          Remove-Item dist\check.exe
          Get-Content check.json
          $c = Get-Content check.json | ConvertFrom-Json
          if ($c.projectkit.Count -lt 6) { throw "project kit missing from the .exe" }
          if (-not $c.serial) { throw "pyserial (the logger) missing from the .exe" }
          if ("${{ github.repository }}" -eq "rz6hkh/ms43diff" -and $c.wiki_missing.Count -gt 0) {
            Write-Output "::warning::the private build's MS4X Wiki is incomplete, missing: $($c.wiki_missing -join ', ')"
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ms43-ai-tuner-windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

      - name: Create release (a tag push, or a manual run with a version)
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', inputs.release) }}
          name: ${{ format('MS43 AI-Tuner {0}', startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release) }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.exe
            dist/*.zip
          generate_release_notes: true
          body: |
            Windows build of MS43 AI-Tuner. No Python needed. Interface in English and Russian
            (switch at the bottom left of the window).

            **Easiest:** download `ms43-ai-tuner-windows.zip`, unpack it into one folder and run
            `ms43-ai-tuner.exe`.

            * `ms43-ai-tuner.exe` — the program: the AI assistant (a live MCP server and a
              tuning project for Claude Code), the Edits screen, logs (built-in K+DCAN logger,
              TunerPro .xdl/.csv), the car profile, firmware comparison, versions and porting,
              patches and the MS4X Wiki reference.
            * `python/` (inside the zip) — Python with pandas and matplotlib that the tuning
              project uses for log analysis; keep it next to the .exe.

            The MS4X Wiki reference: if this build does not carry it, download it in the app
            (**Reference → Update from site**).
