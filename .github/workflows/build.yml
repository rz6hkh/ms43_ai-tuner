name: Build Windows release

# Builds ms43diff-gui.exe and ms43diff-mcp.exe on Windows and attaches them to a
# GitHub Release. Two triggers:
#   * pushing a tag like v1.0.0  -> creates a release with that tag;
#   * manually (Actions -> Run workflow) -> only builds the artifacts.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write        # needed to create the release and upload files

# Force UTF-8 on the runner: the console there is cp1252, and Cyrillic print()
# in selftest.py / build_exe.py would crash with UnicodeEncodeError.
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller reportlab

      - name: Self-test
        run: python selftest.py

      - name: Build .exe
        # The MS4X Wiki is not in the repo (third-party content), so the .exe is
        # built without it; users download it from inside the app.
        run: python build_exe.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ms43diff-windows
          path: dist/*.exe
          if-no-files-found: error

      - name: Create release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
          body: |
            Windows build of ms43diff. No Python needed.

            * `ms43diff-gui.exe` — the window: compare firmwares, colour maps, transfer plan, VE dial-in, reference.
            * `ms43diff-mcp.exe` — MCP server so an AI can read your firmware (setup: HOW_TO_USE_WITH_AI.md).

            The MS4X Wiki reference is not bundled — download it in the app
            (Reference tab → Update from site).
